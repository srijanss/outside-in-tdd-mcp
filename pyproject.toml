[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outside-in-tdd-mcp"
version = "0.1.4"
description = "Language-agnostic MCP server enforcing Outside-In TDD phases"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0,<2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-json-report"]

[project.scripts]
outside-in-tdd-mcp = "core.server:run"
cargo-adapter-runner = "core.adapter_entrypoints:cargo_adapter_main"
pytest-adapter-runner = "core.adapter_entrypoints:pytest_adapter_main"
vitest-adapter-runner = "core.adapter_entrypoints:vitest_adapter_main"

[tool.setuptools]
packages = ["core", "adapters"]

[tool.setuptools.package-data]
adapters = ["*/run.sh"]
